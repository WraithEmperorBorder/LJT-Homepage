name: build-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated content
        run: |
          set -e
          echo "=== HTML pages ==="
          find _site -name '*.html' | sort
          echo "=== Home checks ==="
          for s in "Junteng Liu" "Shanghai Jiao Tong University" "MINIMAX" "Tencent WXG" "Shanghai AI Lab" "Zhiyuan Honor Scholarship" "LLM Reasoning" "Hallucination in Vision-Language Models" "Truthfulness" "jliugi@connect.ust.hk" "Vicent0205" "tbK9jl4AAAAJ" "junteng88716710" "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
            if grep -qi "$s" _site/index.html; then echo "HOME OK: $s"; else echo "HOME MISSING: $s"; fi
          done
          echo "=== Publications subpage checks ==="
          for s in "SynLogic" "Perception Bottleneck of VLMs" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient Modules"; do
            if grep -qi "$s" _site/publications/index.html; then echo "PUBS OK: $s"; else echo "PUBS MISSING: $s"; fi
          done
          echo "=== CV checks ==="
          for s in "Hong Kong University of Science and Technology" "B.Eng" "MINIMAX" "Research interests"; do
            if grep -qi "$s" _site/cv/index.html; then echo "CV OK: $s"; else echo "CV MISSING: $s"; fi
          done
